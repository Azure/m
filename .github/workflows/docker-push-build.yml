name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build-push.yml'
      - '**/*.sh'
      - '**/*.dockerignore'
      - '**/requirements.txt'
      - '**/setup.py'
      - '**/package.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/Pipfile'
      - '**/pyproject.toml'
      - '**/Makefile'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner || toLower }}/doxygen-built:latest .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner || toLower }}/doxygen-built:latest
