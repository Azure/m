name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '.github/workflows/docker-build-push.yml'
      - '**/*.sh'
      - '**/*.dockerignore'
      - '**/requirements.txt'
      - '**/setup.py'
      - '**/package.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/Pipfile'
      - '**/pyproject.toml'
      - '**/Makefile'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
  workflow_dispatch:

jobs:
  discover-dockerfiles:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Dockerfiles
        id: set-matrix
        run: |
          files=$(find . -type f -name 'Dockerfile')
          files_json=$(echo "$files" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix={\"dockerfile\":$files_json}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: discover-dockerfiles
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.discover-dockerfiles.outputs.matrix)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker image name
        id: compute_docker_image_name
        run: |
          IMAGE_NAME=$(basename $(dirname ${{ matrix.dockerfile }}))
          echo "uppercase_image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Lowercase the repository owner names
        id: lower
        run: |
          echo "lowercase_repository_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "lowercase_image_name=$(echo "${{ steps.compute_docker_image_name.outputs.uppercase_image_name }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -f "${{ matrix.dockerfile }}" -t ghcr.io/${{ steps.lower.outputs.lowercase_repository_owner }}m/${{ steps.lower.outputs.lowercase_image_name }}:latest "$(dirname "${{ matrix.dockerfile }}")"

      - name: Push Docker image to GHCR
        run: |
          IMAGE_NAME=$(basename $(dirname ${{ matrix.dockerfile }}))
          docker push ghcr.io/${{ steps.lower.outputs.lowercase_repository_owner }}m/${{ steps.lower.outputs.lowercase_image_name }}:latest
