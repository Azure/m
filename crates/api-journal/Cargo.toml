[package]
name = "api-journal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared NDJSON schema and JSON body-shape model for journaled HTTP API interactions: written by the win32 shim's capture seams and read by the cartographer OpenAPI tool. Pure, platform-independent data; no Win32, no unsafe."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
