[package]
name = "merriam"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A REST dictionary-store service owning a per-(locale,user) custom dictionary on disk via native async Win32 file I/O (windows-file-io), with a listener-independent dispatch core and an HTTP Server API (http.sys) inbound edge."

[dependencies]
# JSON request/response models + the optional `?pattern=` enumeration filter for
# the dispatch core (MW18-2.2). Pure, platform-independent crates; the dispatch
# core carries no listener awareness.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-file-io = { path = "../windows-file-io" }
windows-threadpool-executor = { path = "../windows-threadpool-executor" }

[lints]
workspace = true
