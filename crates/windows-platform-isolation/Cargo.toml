[package]
name = "windows-platform-isolation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
roxmltree = "0.21.1"
windows-text = { path = "../windows-text" }

[dev-dependencies]
# Enable the pure-Rust ASCII ordinal reference so unit tests can exercise the
# casing seam off Windows (M3-2: production builds vend `Win32OrdinalCasing`).
windows-text = { path = "../windows-text", features = ["testing"] }

[lints]
workspace = true
