[package]
name = "windows-threadpool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Safe Rust wrapper over the Windows thread pool API (CreateThreadpoolWork / timers / IO); Rust parity for the C++ m::threadpool library. The only unsafe is quarantined in the internal ffi module (TP-D4)."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[lints]
workspace = true
