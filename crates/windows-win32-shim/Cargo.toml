[package]
name = "windows-win32-shim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Parallel all-Rust reimplementation of the C++ mwin32 DLL: a Win32-shaped C ABI (m-prefixed registry/filesystem entry points) routed through windows-platform-isolation. The only unsafe is quarantined at the ABI boundary (SHIM-D2)."

[lib]
crate-type = ["cdylib", "rlib"]

# Platform-independent dependencies (used by the ungated `alias_gen` / `alias_obj`
# manifest tooling, which has no `unsafe` and no OS dependency).
[dependencies]
# Pure-Rust, zero-dependency, `#![forbid(unsafe_code)]` JSON parser. Reads the
# `.pilcfg` sidecar (SHIM-D5 / MW4) and the NDJSON alias manifest (SHIM-D4 / MW5).
# Chosen for its minimal footprint; the schema mapping is owned here (Design
# Autonomy), not inherited from it.
tinyjson = "2"
# Writes the Win32→`m` alias COFF object directly (SHIM-D4 / MW5): emitting the
# alias artifact needs no C++ compiler and no MSVC tool — only the client's
# linker consumes it. The safe `write`/`read` COFF API is used; the emitted
# symbol/relocation contract is owned here, not inherited from the crate.
object = { version = "0.36", default-features = false, features = [
  "write",
  "read",
  "coff",
  "std",
] }
# The shared NDJSON record schema + JSON body-shape model for API-interaction
# journaling (AJ-B). Pure, platform-independent data; the on-disk format is owned
# by this shared crate so the shim (writer) and the cartographer tool (reader)
# cannot drift.
api-journal = { path = "../api-journal" }
# Literal example bodies captured under `bodies: full-with-pii` are `serde_json::Value`s
# (AJ-DEF-1); the value is produced by `api_journal::derive_example`.
serde_json = "1"
# Derive the position-independent marshaled-interaction format (SHIM-D25): the raw
# intercepted context is serialized to JSON for the off-thread (eventually
# out-of-process) worker.
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-platform-isolation = { path = "../windows-platform-isolation" }
windows-text = { path = "../windows-text" }
# Off-thread interception handling (SHIM-D25): work items + the `WaitOnAddress`
# `WaitGate` latch. Windows-only; the `unsafe` for `WaitOnAddress` is quarantined
# in that crate's `ffi` module, keeping the shim's own `unsafe` at the ABI boundary.
windows-threadpool = { path = "../windows-threadpool" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_Networking_WinHttp",
] }

[lints]
workspace = true
