[package]
name = "wordy"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "A shim-unaware Rust IIS native-module REST 'shared dictionary' service. A realistic third-party HWC application used to prove link-time host-call redirection and to drive HWC business logic on an unprivileged developer machine. Carries no isolation awareness (windows-win32-shim SHIM-D19)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Word-domain core (MW13-2): regex enumeration over the shared dictionary and
# `fst`-backed edit-distance suggestions. Both are pure, platform-independent
# crates; the word-domain core carries no IIS, filesystem, or isolation
# awareness (windows-win32-shim SHIM-D19).
fst = { version = "0.4", features = ["levenshtein"] }
regex = "1"
# JSON request/response models for the REST surface (MW13-4).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
] }

[lints]
workspace = true
